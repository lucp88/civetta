<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Dashboard | Bakkerij Civetta</title>
    <meta name="description" content="Bakkerij Civetta - Ambachtelijk zuurdesem brood uit Leersum.">
    <meta property="og:title" content="Mijn Dashboard | Bakkerij Civetta">
    <meta property="og:description" content="Bakkerij Civetta - Ambachtelijk zuurdesem brood uit Leersum.">
    <meta property="og:image" content="https://www.bakkerij-civetta.nl/img/logo.jpeg">
    <meta property="og:url" content="https://www.bakkerij-civetta.nl/zakelijk-dashboard.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bakkerij Civetta">
    <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        [v-cloak] { display: none; }
        .dashboard-content {
            padding: var(--spacing-lg) 0;
            min-height: calc(100vh - 300px);
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
            gap: var(--spacing-sm);
        }
        .dashboard-header h2 {
            margin-bottom: 0;
        }
        .dashboard-header h2::after {
            display: none;
        }
        .dashboard-actions {
            display: flex;
            gap: var(--spacing-sm);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--color-crust);
            color: var(--color-crust);
        }
        .btn-outline:hover {
            background: var(--color-crust);
            color: white;
        }
        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
        .dashboard-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        .nav-card {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--color-warm-white);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 20px rgba(139, 90, 43, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .nav-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(139, 90, 43, 0.15);
        }
        .nav-card-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            flex-shrink: 0;
        }
        .nav-card-icon.green {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
        }
        .nav-card-icon.blue {
            background: linear-gradient(135deg, #cce5ff, #b8daff);
            color: #004085;
        }
        .nav-card-icon.purple {
            background: linear-gradient(135deg, #e2e3ff, #c5c6fe);
            color: #4a4b98;
        }
        .nav-card-content h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1.1rem;
            color: var(--color-crust-dark);
        }
        .nav-card-content p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--color-stone);
        }
        .nav-card-badge {
            background: var(--color-terracotta);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: auto;
        }
        .quick-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
        }
        .stat-card {
            background: var(--color-warm-white);
            border-radius: 16px;
            padding: var(--spacing-md);
            box-shadow: 0 4px 20px rgba(139, 90, 43, 0.08);
            text-align: center;
        }
        .stat-card h4 {
            margin: 0 0 0.5rem 0;
            font-size: 0.85rem;
            color: var(--color-stone);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-crust-dark);
        }
        .stat-card .value.price {
            color: var(--color-terracotta);
        }
        .loading {
            text-align: center;
            padding: var(--spacing-lg);
            color: var(--color-stone);
        }
        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
    
    <link rel="stylesheet" href="css/fonts.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Civetta</a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="ons-verhaal.html">Ons Verhaal</a></li>
                <li><a href="producten.html">Producten</a></li>
                <li><a href="galerij.html">Galerij</a></li>
                <li><a href="leveranciers.html">Leveranciers</a></li>
                <li><a href="financiering.html">Crowdfunding</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="nav-login">
                    <a href="zakelijk-dashboard.html" class="login-trigger active">Dashboard</a>
                </li>
            </ul>
            <button class="mobile-menu-btn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Mijn Dashboard</h1>
        </section>

        <section class="dashboard-content">
            <div class="container">
                <div id="dashboard-app" v-cloak>
                    <div v-if="loading" class="loading">Gegevens laden...</div>
                    
                    <template v-else>
                        <div class="dashboard-header">
                            <h2>Welkom, {{ account.bedrijfsnaam }}</h2>
                            <div class="dashboard-actions">
                                <button @click="logout" class="btn btn-outline btn-small">Uitloggen</button>
                            </div>
                        </div>

                        <div class="dashboard-nav">
                            <a href="bestelling-plaatsen.html" class="nav-card">
                                <div class="nav-card-icon green">+</div>
                                <div class="nav-card-content">
                                    <h3>Nieuwe Bestelling</h3>
                                    <p>Plaats een nieuwe bestelling</p>
                                </div>
                            </a>
                            
                            <a href="mijn-bestellingen.html" class="nav-card">
                                <div class="nav-card-icon blue">&#128230;</div>
                                <div class="nav-card-content">
                                    <h3>Mijn Bestellingen</h3>
                                    <p>Bekijk lopende en afgeronde bestellingen</p>
                                </div>
                                <span v-if="lopendeBestellingen > 0" class="nav-card-badge">{{ lopendeBestellingen }}</span>
                            </a>
                            
                            <a href="bedrijfsgegevens.html" class="nav-card">
                                <div class="nav-card-icon purple">&#9881;</div>
                                <div class="nav-card-content">
                                    <h3>{{ accountType === 'particulier' ? 'Mijn Gegevens' : 'Bedrijfsgegevens' }}</h3>
                                    <p>{{ accountType === 'particulier' ? 'Beheer uw gegevens' : 'Beheer uw bedrijfsinformatie' }}</p>
                                </div>
                            </a>
                        </div>

                        <div class="quick-stats">
                            <div v-if="hasBalance" class="stat-card">
                                <h4>Saldo</h4>
                                <div class="value price">{{ formatPrice(balance) }}</div>
                            </div>
                            <div class="stat-card">
                                <h4>Lopende Bestellingen</h4>
                                <div class="value">{{ lopendeBestellingen }}</div>
                            </div>
                            <div class="stat-card">
                                <h4>Afgeronde Bestellingen</h4>
                                <div class="value">{{ afgerondeBestellingen }}</div>
                            </div>
                            <div class="stat-card">
                                <h4>Totaal Besteld</h4>
                                <div class="value price">{{ formatPrice(totaalBesteld) }}</div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p><strong>Bakkerij Civetta</strong></p>
                    <p>Leersum, Utrecht</p>
                </div>
                <img src="img/logo.jpeg" alt="Civetta" class="footer-logo">
                <div class="footer-contact">
                    <p><a href="mailto:info@bakkerij-civetta.nl">info@bakkerij-civetta.nl</a></p>
                    <p><a href="privacy.html">Privacybeleid</a></p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="js/main.js"></script>
    <script>
        const { createApp } = Vue;
        
        createApp({
            data() {
                return {
                    loading: true,
                    account: {},
                    orders: [],
                    accountType: 'zakelijk',
                    hasBalance: false,
                    balance: 0
                };
            },
            
            computed: {
                lopendeBestellingen() {
                    return this.orders.filter(o => 
                        !['delivered', 'cancelled'].includes(o.status) && 
                        !['delivered', 'cancelled'].includes(o.mollie_status)
                    ).length;
                },
                afgerondeBestellingen() {
                    return this.orders.filter(o => 
                        ['delivered', 'cancelled'].includes(o.status) || 
                        ['delivered', 'cancelled'].includes(o.mollie_status)
                    ).length;
                },
                totaalBesteld() {
                    return this.orders.reduce((sum, o) => sum + parseFloat(o.total_amount || 0), 0);
                }
            },
            
            async mounted() {
                const stored = sessionStorage.getItem('businessAccount');
                if (!stored) {
                    window.location.href = 'login.html';
                    return;
                }
                
                await Promise.all([
                    this.loadProfile(),
                    this.loadOrders()
                ]);
            },
            
            methods: {
                async loadProfile() {
                    try {
                        const response = await fetch('api/business-dashboard.php?action=profile');
                        const data = await response.json();
                        
                        if (data.success) {
                            this.account = data.account;
                            this.accountType = data.account.account_type || 'zakelijk';
                            this.hasBalance = !!parseInt(data.account.has_balance || 0);
                            this.balance = parseFloat(data.account.balance || 0);
                            this.loading = false;
                        } else {
                            sessionStorage.removeItem('businessAccount');
                            window.location.href = 'login.html';
                        }
                    } catch (error) {
                        sessionStorage.removeItem('businessAccount');
                        window.location.href = 'login.html';
                    }
                },
                
                async loadOrders() {
                    try {
                        const response = await fetch('api/business-orders.php');
                        const data = await response.json();
                        if (data.success) {
                            this.orders = data.orders;
                        }
                    } catch (error) {
                        console.error('Kon bestellingen niet laden');
                    }
                },
                
                logout() {
                    sessionStorage.removeItem('businessAccount');
                    fetch('api/business-logout.php');
                    window.location.href = 'index.html';
                },
                
                formatPrice(amount) {
                    if (!amount) return '€ 0,00';
                    return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(amount);
                }
            }
        }).mount('#dashboard-app');
    </script>
</body>
</html>
